spring:
  application:
    name: Bank Transfer API
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # Credentials come from the environment; the defaults keep local runs working.
    # Never commit real production secrets here.
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/orclpdb}
    username: ${DB_USERNAME:EWALLET}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  web:
    error:
      include-message: always

# Two-step verification for large transfers (rule 5).
# The code is generated on the first attempt, logged as a simulated SMS,
# and must be echoed back in verificationCode.
bank:
  transfer:
    verification-threshold: 10000

server:
  port: 8085
