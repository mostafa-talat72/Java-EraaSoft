<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Player #' + ${player.id}">Player Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:text="'Player #' + ${player.id}">Player Profile</h1>

    <table class="table">
        <tr>
            <th>ID</th>
            <td th:text="${player.id}">1</td>
        </tr>
        <tr>
            <th>Name</th>
            <td th:text="${player.name}">Messi</td>
        </tr>
        <tr>
            <th>Number</th>
            <td th:text="${player.number}">10</td>
        </tr>
        <tr>
            <th>Salary</th>
            <td th:text="${player.salary}">100000.0</td>
        </tr>
    </table>

    <div class="form-actions">
        <a th:href="@{/web/players/edit/{id}(id=${player.id})}" class="btn btn-edit">Edit</a>
        <a th:href="@{/web/players}" class="btn">Back to List</a>
    </div>
</div>
</body>
</html>
