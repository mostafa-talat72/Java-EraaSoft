<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Employee #' + ${employee.id}">Employee Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:text="'Employee #' + ${employee.id}">Employee Profile</h1>

    <table class="table">
        <tr><th>ID</th><td th:text="${employee.id}">1</td></tr>
        <tr><th>Name</th><td th:text="${employee.name}">Ahmed</td></tr>
        <tr><th>Age</th><td th:text="${employee.age}">25</td></tr>
        <tr><th>Phone</th><td th:text="${employee.phoneNumber}">01012345678</td></tr>
    </table>

    <div class="form-actions">
        <a th:href="@{/web/employees/edit/{id}(id=${employee.id})}" class="btn btn-edit">Edit</a>
        <a th:href="@{/web/employees}" class="btn">Back to List</a>
    </div>
</div>
</body>
</html>
