<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update List - Employees</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Update Multiple Employees</h1>
    <p class="hint">Edit selected employees and save together. All rows go to <code>PUT /employees/list</code> via RestTemplate.</p>

    <div th:if="${filterInfo}" class="alert-info" th:text="${filterInfo}"></div>
    <div th:if="${loadError}" class="alert-error" th:text="${loadError}"></div>

    <p th:if="${#lists.isEmpty(bulkForm.employees)}" class="empty">No employees to edit. Go to list and select IDs.</p>

    <form th:if="${!#lists.isEmpty(bulkForm.employees)}" th:object="${bulkForm}" th:action="@{/web/employees/update-list}" method="post" class="form" id="update-list-form">
        <input type="hidden" name="_method" value="PUT">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert-error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Global error</p>
        </div>

        <div id="rows-container">
        <div th:each="emp, stat : *{employees}" class="list-row">
            <div class="row-header">
                <h3 th:text="'Employee #' + ${emp.id} + ' - ' + ${emp.name}">Employee</h3>
                <button type="button" class="btn btn-delete btn-sm remove-row-btn">Remove</button>
            </div>
            <input type="hidden" th:field="*{employees[__${stat.index}__].id}">
            <div class="form-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" th:field="*{employees[__${stat.index}__].name}"
                           th:classappend="${#fields.hasErrors('employees[__${stat.index}__].name')} ? 'input-error' : ''">
                    <span th:if="${#fields.hasErrors('employees[__${stat.index}__].name')}"
                          th:errors="*{employees[__${stat.index}__].name}" class="error"></span>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" th:field="*{employees[__${stat.index}__].age}"
                           th:classappend="${#fields.hasErrors('employees[__${stat.index}__].age')} ? 'input-error' : ''">
                    <span th:if="${#fields.hasErrors('employees[__${stat.index}__].age')}"
                          th:errors="*{employees[__${stat.index}__].age}" class="error"></span>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" th:field="*{employees[__${stat.index}__].phoneNumber}"
                           th:classappend="${#fields.hasErrors('employees[__${stat.index}__].phoneNumber')} ? 'input-error' : ''">
                    <span th:if="${#fields.hasErrors('employees[__${stat.index}__].phoneNumber')}"
                          th:errors="*{employees[__${stat.index}__].phoneNumber}" class="error"></span>
                </div>
            </div>
        </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update All</button>
            <a th:href="@{/web/employees}" class="btn">Cancel</a>
        </div>
    </form>
</div>
<script th:src="@{/js/update-list.js}"></script>
</body>
</html>
